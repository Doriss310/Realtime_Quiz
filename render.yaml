services:
  - type: web
    name: realtime-laravel-mysql
    env: php
    rootDir: backend
    buildCommand: |
      composer install
      php artisan config:cache
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
