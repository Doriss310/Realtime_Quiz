      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: quiz_project
      - key: DB_USERNAME
        value: quiz_project_user
      - key: DB_PASSWORD
        value: hZkrPahkYq0xOl2QtSKx8Wa1zbnZwzzw
